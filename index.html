<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hugo Ribeiro - Links</title>
    <meta name="description" content="Hugo Ribeiro - Software Engineer. Links to portfolio, GitHub, LinkedIn and contact." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --color-bg: #0a0a0b;
        --color-panel: #17171a;
        --color-panel-alt: #1e1e21;
        --color-border: #2a2a2e;
        --color-border-soft: #232326;

        --color-text: #f5f5f4;
        --color-text-muted: #9a9a9d;
        --color-text-faint: #6c6c70;

        --color-btn-primary-bg: #f5f5f4;
        --color-btn-primary-text: #0a0a0b;

        --font-mono: 'JetBrains Mono', monospace;
        --font-sans: 'Inter', sans-serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        display: flex;
        justify-content: center;
        padding: 64px 20px;
      }

      main {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--color-border);
        background: var(--color-panel);
        margin-bottom: 20px;
      }

      h1 {
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 6px;
        text-align: center;
      }

      .tagline {
        font-size: 14px;
        color: var(--color-text-muted);
        text-align: center;
        margin: 0 0 36px;
      }

      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .link {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 16px 20px;
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        border-radius: 999px;
        color: var(--color-text);
        text-decoration: none;
        font-family: var(--font-sans);
        font-size: 15px;
        font-weight: 600;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          border-color 0.15s ease;
      }

      .link:hover,
      .link:focus-visible {
        background: var(--color-panel-alt);
        border-color: var(--color-text);
        transform: translateY(-2px);
      }

      .link .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text);
      }

      .link .icon svg {
        width: 100%;
        height: 100%;
      }

      footer {
        margin-top: 48px;
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--color-text-faint);
        text-align: center;
      }

      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
